name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build libcli11-dev nlohmann-json3-dev \
            libosmium2-dev libprotozero-dev libboost-dev libgtest-dev zlib1g-dev

      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev
